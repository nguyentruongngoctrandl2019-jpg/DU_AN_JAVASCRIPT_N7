<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi Tiết Sản Phẩm | CT Tech Store</title>
  <meta name="description"
    content="Xem chi tiết cấu hình, giá bán, hình ảnh thực tế và đánh giá sản phẩm công nghệ chính hãng tại CT Tech Store." />
  <!-- Google Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-40 bg-slate-950/95 backdrop-blur-md border-b border-slate-800 text-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        <a href="/index.html" class="flex items-center gap-2.5 shrink-0">
          <span
            class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 text-white font-black flex items-center justify-center text-base shadow-md shadow-blue-500/20">CT</span>
          <span class="text-lg font-black tracking-tight text-white whitespace-nowrap">CT TECH STORE</span>
        </a>

        <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-300">
          <a href="/index.html" class="hover:text-white transition-colors whitespace-nowrap">Trang chủ</a>
          <a href="/products.html" class="text-blue-400 font-semibold whitespace-nowrap">Sản phẩm</a>
          <a href="/cart.html" class="hover:text-white transition-colors whitespace-nowrap">Giỏ hàng</a>
          <a href="/profile.html" class="hover:text-white transition-colors whitespace-nowrap">Đơn hàng</a>
        </nav>

        <div class="flex items-center gap-3 shrink-0">
          <a href="/cart.html"
            class="relative p-2 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition-colors"
            aria-label="Giỏ hàng">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
            </svg>
            <span
              class="ct-cart-badge absolute -top-1 -right-1 bg-red-600 text-white font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-950 hidden">0</span>
          </a>
          <div class="ct-user-auth-slot flex items-center"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- Breadcrumb -->
  <div class="bg-white border-b border-slate-200 py-3 text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center gap-2">
      <a href="/index.html" class="hover:text-slate-900 transition-colors">Trang chủ</a>
      <span>/</span>
      <a href="/products.html" class="hover:text-slate-900 transition-colors">Sản phẩm</a>
      <span>/</span>
      <span id="breadcrumb-product-name" class="text-slate-900 font-semibold truncate max-w-xs">Đang tải...</span>
    </div>
  </div>

  <!-- Product Detail Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full">
    <div id="product-detail-view" class="space-y-12">
      <!-- Injected by JavaScript -->
      <div class="py-20 text-center text-slate-400">Đang tải thông tin sản phẩm...</div>
    </div>

    <!-- Related Products Section -->
    <section class="mt-16 pt-12 border-t border-slate-200">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-black text-slate-900 tracking-tight">Sản Phẩm Cùng Phân Khúc</h2>
        <a href="/products.html" class="text-xs font-bold text-blue-600 hover:text-blue-700">Xem tất cả →</a>
      </div>
      <div id="related-products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </section>
  </main>

  <!-- Footer Container -->
  <div id="footer-container"></div>

  <script src="/script.js"></script>
  <script>
    let currentProduct = null;
    let selectedColor = '';
    let selectedStorage = '';
    let selectedQuantity = 1;

    document.addEventListener('DOMContentLoaded', async () => {
      await CTTech.initDatabase();

      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id') || 'ct-001';
      currentProduct = CTTech.getProductById(productId);

      if (!currentProduct) {
        document.getElementById('product-detail-view').innerHTML = `
            <div class="py-20 text-center space-y-4 bg-white rounded-2xl border border-slate-200 p-8">
              <h2 class="text-xl font-bold text-slate-800">Sản phẩm không tồn tại hoặc đã ngừng kinh doanh</h2>
              <p class="text-xs text-slate-500">Vui lòng quay lại trang danh sách sản phẩm để khám phá mẫu khác.</p>
              <a href="/products.html" class="inline-block px-5 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-semibold">Về trang sản phẩm</a>
            </div>
          `;
        return;
      }

      document.title = `${currentProduct.name} | CT Tech Store`;
      document.getElementById('breadcrumb-product-name').textContent = currentProduct.name;

      selectedColor = currentProduct.colors && currentProduct.colors.length > 0 ? currentProduct.colors[0] : '';
      selectedStorage = currentProduct.storageOptions && currentProduct.storageOptions.length > 0 ? currentProduct.storageOptions[0] : '';

      renderProductDetail();
      renderRelatedProducts();

      // Modular footer
      fetch('/footer.html')
        .then(res => res.text())
        .then(html => { document.getElementById('footer-container').innerHTML = html; })
        .catch(() => { });
    });

    function renderProductDetail() {
      const p = currentProduct;
      const container = document.getElementById('product-detail-view');

      const galleryImages = p.images && p.images.length > 0 ? p.images : [p.image];

      container.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <!-- Left: Gallery Showcase -->
            <div class="lg:col-span-6 space-y-4">
              <div class="aspect-4/3 rounded-2xl overflow-hidden bg-white border border-slate-200 p-4 shadow-sm flex items-center justify-center">
                <img id="main-product-image" src="${galleryImages[0]}" alt="${p.name}" class="max-h-full max-w-full object-contain transition-all duration-300" />
              </div>
              
              <!-- Thumbnails -->
              <div class="flex items-center gap-3 overflow-x-auto pb-2">
                ${galleryImages.map((img, idx) => `
                  <button 
                    type="button" 
                    onclick="changeMainImage('${img}')" 
                    class="w-20 h-20 rounded-xl bg-white border-2 overflow-hidden shrink-0 hover:border-blue-500 transition-all p-1 ${idx === 0 ? 'border-blue-600' : 'border-slate-200'}"
                  >
                    <img src="${img}" alt="${p.name}" class="w-full h-full object-cover rounded-lg" />
                  </button>
                `).join('')}
              </div>

              <!-- Trust Highlights -->
              <div class="bg-blue-50/70 border border-blue-100 rounded-2xl p-4 grid grid-cols-3 gap-3 text-center text-xs">
                <div>
                  <div class="font-bold text-blue-900">Bảo Hành 12T</div>
                  <div class="text-[11px] text-blue-700">Chính hãng Apple/Sony</div>
                </div>
                <div>
                  <div class="font-bold text-blue-900">1 Đổi 1 - 30 Ngày</div>
                  <div class="text-[11px] text-blue-700">Lỗi phần cứng NSX</div>
                </div>
                <div>
                  <div class="font-bold text-blue-900">Giao Hàng Miễn Phí</div>
                  <div class="text-[11px] text-blue-700">Toàn quốc đơn > 10tr</div>
                </div>
              </div>
            </div>

            <!-- Right: Product Purchase Module (PDP) -->
            <div class="lg:col-span-6 space-y-6">
              
              <div class="space-y-2 border-b border-slate-200 pb-5">
                <div class="flex items-center gap-3 text-xs">
                  <span class="font-bold text-blue-600 uppercase tracking-wider">${p.brand}</span>
                  <span class="text-slate-300">·</span>
                  <span class="text-slate-500">${p.categoryName}</span>
                  <span class="text-slate-300">·</span>
                  <span class="text-emerald-600 font-semibold flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Còn hàng (${p.stockCount || 25} chiếc)
                  </span>
                </div>

                <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight leading-snug">
                  ${p.name}
                </h1>

                <div class="flex items-center gap-3 text-xs pt-1">
                  <div class="flex items-center text-amber-500 font-bold">
                    <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
                    <span class="ml-1 text-slate-800">${p.rating}</span>
                  </div>
                  <span class="text-slate-300">|</span>
                  <span class="text-slate-500">${p.reviewsCount} Đánh giá từ khách hàng</span>
                </div>
              </div>

              <!-- Price Box -->
              <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                <div>
                  <p class="text-xs text-slate-400 font-medium">Giá bán chính hãng (Đã gồm VAT):</p>
                  <div class="flex items-baseline gap-3 mt-1">
                    <span class="text-3xl font-black text-blue-600 tabular-nums">${CTTech.formatVND(p.price)}</span>
                    ${p.oldPrice ? `<span class="text-sm text-slate-400 line-through tabular-nums">${CTTech.formatVND(p.oldPrice)}</span>` : ''}
                  </div>
                </div>
                ${p.discount ? `
                  <div class="bg-red-50 text-red-600 border border-red-200 rounded-xl px-3 py-1.5 text-center">
                    <span class="text-xs block font-medium">Tiết kiệm</span>
                    <strong class="text-sm font-bold">-${p.discount}%</strong>
                  </div>
                ` : ''}
              </div>

              <!-- Color Selection -->
              ${p.colors && p.colors.length > 0 ? `
                <div class="space-y-2.5">
                  <label class="text-xs font-bold text-slate-900 uppercase tracking-wider block">
                    Màu sắc: <span id="selected-color-label" class="text-blue-600 font-semibold normal-case">${selectedColor}</span>
                  </label>
                  <div class="flex flex-wrap gap-2.5">
                    ${p.colors.map(col => `
                      <button 
                        type="button" 
                        onclick="selectColor('${col}')" 
                        class="px-4 py-2 rounded-xl text-xs font-semibold border transition-all ${col === selectedColor ? 'border-blue-600 bg-blue-50 text-blue-700 shadow-sm' : 'border-slate-200 bg-white text-slate-700 hover:border-slate-300'}"
                      >
                        ${col}
                      </button>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              <!-- Storage / Spec Selection -->
              ${p.storageOptions && p.storageOptions.length > 0 ? `
                <div class="space-y-2.5">
                  <label class="text-xs font-bold text-slate-900 uppercase tracking-wider block">
                    Phiên bản bộ nhớ / Cấu hình: <span id="selected-storage-label" class="text-blue-600 font-semibold normal-case">${selectedStorage}</span>
                  </label>
                  <div class="flex flex-wrap gap-2.5">
                    ${p.storageOptions.map(st => `
                      <button 
                        type="button" 
                        onclick="selectStorage('${st}')" 
                        class="px-4 py-2 rounded-xl text-xs font-semibold border transition-all ${st === selectedStorage ? 'border-blue-600 bg-blue-50 text-blue-700 shadow-sm' : 'border-slate-200 bg-white text-slate-700 hover:border-slate-300'}"
                      >
                        ${st}
                      </button>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              <!-- Quantity Selector & Action Buttons -->
              <div class="space-y-4 pt-2">
                <div class="flex items-center gap-4">
                  <label class="text-xs font-bold text-slate-900 uppercase tracking-wider">Số lượng:</label>
                  <div class="flex items-center border border-slate-300 rounded-xl bg-white overflow-hidden shadow-sm">
                    <button type="button" onclick="changeQty(-1)" class="px-3.5 py-1.5 text-slate-600 hover:bg-slate-100 font-bold text-sm">-</button>
                    <span id="qty-display" class="px-4 py-1.5 text-xs font-mono font-bold text-slate-900 select-none">1</span>
                    <button type="button" onclick="changeQty(1)" class="px-3.5 py-1.5 text-slate-600 hover:bg-slate-100 font-bold text-sm">+</button>
                  </div>
                </div>

                <!-- Primary CTAs -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                  <button 
                    type="button" 
                    onclick="handleAddToCart()" 
                    class="w-full py-3.5 px-6 rounded-xl text-xs font-bold border-2 border-blue-600 text-blue-600 bg-blue-50/50 hover:bg-blue-600 hover:text-white transition-all flex items-center justify-center gap-2"
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    Thêm vào giỏ hàng
                  </button>
                  
                  <button 
                    type="button" 
                    onclick="handleBuyNow()" 
                    class="w-full py-3.5 px-6 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2"
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Mua ngay (Giao 2h)
                  </button>
                </div>
              </div>

              <!-- Description Excerpt -->
              <div class="pt-4 border-t border-slate-200">
                <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wider mb-2">Mô tả sản phẩm</h3>
                <p class="text-xs text-slate-600 leading-relaxed">${p.description}</p>
              </div>

            </div>
          </div>

          <!-- Specifications Table -->
          ${p.specs ? `
            <div class="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-sm">
              <h2 class="text-lg font-black text-slate-900 tracking-tight mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
                Bảng Thông Số Kỹ Thuật Chi Tiết
              </h2>
              <div class="divide-y divide-slate-100 text-xs">
                ${Object.entries(p.specs).map(([k, v]) => `
                  <div class="grid grid-cols-1 sm:grid-cols-3 py-3 gap-2">
                    <span class="font-semibold text-slate-500">${k}</span>
                    <span class="sm:col-span-2 text-slate-900 font-medium">${v}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Customer Reviews Section -->
          <div class="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-sm space-y-6">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4">
              <div>
                <h3 class="text-lg font-black text-slate-900">Đánh Giá Từ Khách Hàng</h3>
                <p class="text-xs text-slate-500">Tổng hợp trải nghiệm mua sắm thực tế</p>
              </div>
              <div class="text-right">
                <div class="text-2xl font-black text-amber-500">${p.rating} / 5.0</div>
                <span class="text-[11px] text-slate-400">${p.reviewsCount} nhận xét chính chủ</span>
              </div>
            </div>

            <!-- Sample reviews -->
            <div class="space-y-4">
              <div class="border-b border-slate-100 pb-4">
                <div class="flex items-center justify-between text-xs mb-1">
                  <strong class="text-slate-800">Hoàng Nam (Hà Nội)</strong>
                  <span class="text-slate-400">2 ngày trước</span>
                </div>
                <div class="text-amber-500 text-xs mb-1">★★★★★ <span class="text-emerald-600 text-[11px] font-semibold">✓ Đã mua hàng tại CT Tech</span></div>
                <p class="text-xs text-slate-600">Máy nguyên seal tem hãng, đóng gói cực kỳ cẩn thận. Giao hỏa tốc 2 tiếng đúng giờ. Hóa đơn điện tử xuất nhanh gọn!</p>
              </div>

              <div class="border-b border-slate-100 pb-4">
                <div class="flex items-center justify-between text-xs mb-1">
                  <strong class="text-slate-800">Minh Anh (TP. Hồ Chí Minh)</strong>
                  <span class="text-slate-400">5 ngày trước</span>
                </div>
                <div class="text-amber-500 text-xs mb-1">★★★★★ <span class="text-emerald-600 text-[11px] font-semibold">✓ Đã mua hàng tại CT Tech</span></div>
                <p class="text-xs text-slate-600">Màu sắc thực tế quá đẹp, hiệu năng xử lý mượt mà. Đội ngũ kỹ thuật hỗ trợ chuyển dữ liệu rất nhiệt tình.</p>
              </div>
            </div>
          </div>
        `;
    }

    window.changeMainImage = (url) => {
      const img = document.getElementById('main-product-image');
      if (img) img.src = url;
    };

    window.selectColor = (color) => {
      selectedColor = color;
      const lbl = document.getElementById('selected-color-label');
      if (lbl) lbl.textContent = color;
      renderProductDetail();
    };

    window.selectStorage = (storage) => {
      selectedStorage = storage;
      const lbl = document.getElementById('selected-storage-label');
      if (lbl) lbl.textContent = storage;
      renderProductDetail();
    };

    window.changeQty = (delta) => {
      selectedQuantity = Math.max(1, Math.min(99, selectedQuantity + delta));
      const display = document.getElementById('qty-display');
      if (display) display.textContent = selectedQuantity;
    };

    window.handleAddToCart = () => {
      if (!currentProduct) return;
      CTTech.addToCart(currentProduct.id, selectedQuantity, selectedColor, selectedStorage);
    };

    window.handleBuyNow = () => {
      if (!currentProduct) return;
      CTTech.addToCart(currentProduct.id, selectedQuantity, selectedColor, selectedStorage);
      setTimeout(() => {
        window.location.href = '/checkout.html';
      }, 300);
    };

    function renderRelatedProducts() {
      if (!currentProduct) return;
      const products = CTTech.getProducts();
      const related = products
        .filter(p => p.id !== currentProduct.id && p.category === currentProduct.category)
        .slice(0, 4);

      const fallback = related.length > 0 ? related : products.filter(p => p.id !== currentProduct.id).slice(0, 4);

      const container = document.getElementById('related-products-grid');
      container.innerHTML = fallback.map(p => `
          <div class="bg-white rounded-2xl border border-slate-200/80 p-4 flex flex-col justify-between product-card group">
            <div>
              <div class="relative aspect-4/3 rounded-xl overflow-hidden bg-slate-100 mb-4">
                <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" />
                <div class="absolute top-2.5 right-2.5 bg-slate-900/80 backdrop-blur text-white text-[10px] font-semibold px-2 py-0.5 rounded">
                  ${p.brand}
                </div>
              </div>
              <h4 class="text-xs font-bold text-slate-900 line-clamp-2 hover:text-blue-600 transition-colors">
                <a href="/product-detail.html?id=${p.id}">${p.name}</a>
              </h4>
              <div class="mt-2 text-sm font-black text-blue-600 tabular-nums">
                ${CTTech.formatVND(p.price)}
              </div>
            </div>
            <a href="/product-detail.html?id=${p.id}" class="mt-3 block text-center py-2 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">
              Xem chi tiết
            </a>
          </div>
        `).join('');
    }
  </script>
</body>

</html>
