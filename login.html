<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập Tài Khoản | CT Tech Store</title>
  <meta name="description"
    content="Đăng nhập tài khoản CT Tech Store để theo dõi đơn hàng, tải hóa đơn điện tử và hưởng ưu đãi thành viên." />
  <!-- Google Fonts & Styles -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col justify-between">

  <!-- Top Navigation Bar -->
  <header class="bg-slate-950 text-white border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/index.html" class="flex items-center gap-2.5">
        <span
          class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 text-white font-black flex items-center justify-center text-sm shadow-md">CT</span>
        <span class="text-base font-black tracking-tight">CT TECH STORE</span>
      </a>
      <a href="/index.html" class="text-xs text-slate-400 hover:text-white transition-colors">Về trang chủ →</a>
    </div>
  </header>

  <!-- Main Login Card -->
  <main class="max-w-md w-full mx-auto px-4 py-12 flex-1 flex flex-col justify-center">
    <div class="bg-white rounded-3xl border border-slate-200/80 p-8 shadow-xl space-y-6">

      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 mx-auto flex items-center justify-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
            </path>
          </svg>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">Đăng Nhập CT Tech</h1>
        <p class="text-xs text-slate-500">Quản lý lịch sử đơn hàng và quyền lợi thành viên</p>
      </div>

      <!-- 1-Click Quick Fill Credentials -->
      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 space-y-2">
        <p class="text-[11px] font-bold text-slate-700">Tài khoản thử nghiệm nhanh (1-Click):</p>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="fillAccount('user@cttech.vn', '123')"
            class="px-3 py-2 bg-white hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-xl text-left text-xs text-slate-700 font-medium transition-colors">
            <strong class="block text-slate-900 font-bold">Khách hàng mẫu</strong>
            <span class="text-[10px] text-slate-500">user@cttech.vn</span>
          </button>

          <button type="button" onclick="fillAccount('admin@cttech.vn', 'admin')"
            class="px-3 py-2 bg-white hover:bg-amber-50 border border-slate-200 hover:border-amber-300 rounded-xl text-left text-xs text-slate-700 font-medium transition-colors">
            <strong class="block text-amber-700 font-bold">Quản trị viên (Admin)</strong>
            <span class="text-[10px] text-slate-500">admin@cttech.vn</span>
          </button>
        </div>
      </div>

      <!-- Form -->
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Địa chỉ Email</label>
          <input id="login-email" type="email" required placeholder="nhap-email@cttech.vn"
            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-blue-500" />
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-bold text-slate-700">Mật khẩu</label>
            <a href="#"
              onclick="alert('Vui lòng dùng tài khoản mẫu: user@cttech.vn / 123 hoặc admin@cttech.vn / admin')"
              class="text-[11px] text-blue-600 hover:underline">Quên mật khẩu?</a>
          </div>
          <input id="login-password" type="password" required placeholder="••••••••"
            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-blue-500" />
        </div>

        <div class="flex items-center">
          <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-600">
            <input type="checkbox" checked class="rounded text-blue-600 focus:ring-blue-500" />
            <span>Ghi nhớ phiên đăng nhập trên thiết bị này</span>
          </label>
        </div>

        <button type="submit"
          class="w-full py-3.5 px-6 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2">
          Đăng nhập ngay
        </button>
      </form>

      <div class="text-center pt-2 text-xs text-slate-500">
        Chưa có tài khoản?
        <a href="/register.html" class="text-blue-600 hover:text-blue-700 font-bold ml-1">Đăng ký thành viên mới</a>
      </div>

    </div>
  </main>

  <!-- Footer Container -->
  <div id="footer-container"></div>

  <script src="/script.js"></script>
  <script>
    window.fillAccount = (email, password) => {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
    };

    document.addEventListener('DOMContentLoaded', async () => {
      await CTTech.initDatabase();

      const form = document.getElementById('login-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;

        const res = CTTech.login(email, pass);
        if (res.success) {
          setTimeout(() => {
            if (res.user.role === 'admin') {
              window.location.href = '/admin.html';
            } else {
              window.location.href = '/profile.html';
            }
          }, 600);
        } else {
          CTTech.showToast(res.message, 'error');
        }
      });

      // Modular footer
      fetch('/footer.html')
        .then(res => res.text())
        .then(html => { document.getElementById('footer-container').innerHTML = html; })
        .catch(() => { });
    });
  </script>
</body>

</html>
