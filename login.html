<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập Sinh Viên - UniStore</title>
    <meta name="description" content="Đăng nhập tài khoản sinh viên UniStore để nhận ưu đãi thiết bị công nghệ." />
    <link rel="stylesheet" href="/src/index.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @theme {
  /* ============================================================
     HƯỚNG DẪN DÀNH CHO SINH VIÊN: TÙY CHỈNH MÀU SẮC CHỦ ĐẠO (THEME)
     Để đổi màu chủ đạo cho toàn bộ hệ thống (ví dụ xanh dương Indigo, 
     xanh ngọc Emerald, cam san hô hay đỏ Bordeaux), sinh viên chỉ cần
     thay đổi bảng mã màu HEX của --color-primary-* dưới đây:
     ============================================================ */
  --color-primary-50: #eef2ff;
  --color-primary-100: #e0e7ff;
  --color-primary-200: #c7d2fe;
  --color-primary-300: #a5b4fc;
  --color-primary-400: #818cf8;
  --color-primary-500: #6366f1;
  --color-primary-600: #4f46e5;
  --color-primary-700: #4338ca;
  --color-primary-800: #3730a3;
  --color-primary-900: #312e81;
  --color-primary-950: #1e1b4b;
}

/* Font và reset phụ trợ */
@layer base {
  body {
    @apply bg-slate-50 text-slate-800 antialiased font-sans;
  }
}
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">
    <input type="checkbox" id="sidebar-toggle" class="peer hidden" />
    <label for="sidebar-toggle" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-40 hidden peer-checked:block lg:hidden cursor-pointer" aria-hidden="true"></label>

    <div class="flex flex-1">
      <aside class="fixed top-0 bottom-0 left-0 z-50 w-72 bg-white border-r border-slate-200 flex flex-col justify-between transition-transform duration-200 ease-in-out -translate-x-full peer-checked:translate-x-0 lg:translate-x-0 lg:static lg:h-screen lg:sticky shrink-0 overflow-y-auto">
        <div>
          <div class="p-5 border-b border-slate-100 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 group">
              <div class="w-10 h-10 rounded-xl bg-primary-600 flex items-center justify-center text-white shadow-sm shadow-primary-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
              </div>
              <div>
                <span class="text-lg font-bold text-slate-900 tracking-tight block">UniStore</span>
                <span class="text-[11px] font-medium text-slate-500 block">Đồ án Web · Sinh viên</span>
              </div>
            </a>
          </div>

          <div class="px-3 py-4">
            <nav class="space-y-1">
              <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 text-sm font-medium">Trang Chủ</a>
              <a href="products.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 text-sm font-medium">Sản Phẩm Sinh Viên</a>
              <a href="cart.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 text-sm font-medium">Giỏ Hàng</a>
              <a href="login.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-primary-50 text-primary-700 font-semibold text-sm border-r-4 border-primary-600">Đăng Nhập</a>
              <a href="register.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 text-sm font-medium">Đăng Ký</a>
            </nav>
          </div>
        </div>
      </aside>

      <div class="flex-1 flex flex-col min-w-0">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 lg:px-8 py-3.5 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <label for="sidebar-toggle" class="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 cursor-pointer">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </label>
            <h1 class="text-lg lg:text-xl font-bold text-slate-900">Đăng Nhập Hệ Thống</h1>
          </div>
          <a href="register.html" class="text-xs font-semibold text-primary-600 hover:underline">Chưa có tài khoản? Đăng ký</a>
        </header>

        <main class="flex-1 flex items-center justify-center p-4 lg:p-8">
          <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 space-y-6 shadow-sm">
            <div class="text-center space-y-2">
              <h2 class="text-xl font-extrabold text-slate-900">Chào Mừng Sinh Viên Quay Lại</h2>
              <p class="text-xs text-slate-500">Nhập email hoặc mã số sinh viên để tiếp tục mua sắm</p>
            </div>

            <form action="profile.html" method="get" class="space-y-4 text-xs">
              <div class="space-y-1">
                <label for="login-email" class="font-semibold text-slate-700">Email trường học hoặc Tên đăng nhập *</label>
                <input type="text" id="login-email" required value="an.nguyen24@sinhvien.edu.vn" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-primary-500" />
              </div>

              <div class="space-y-1">
                <label for="login-password" class="font-semibold text-slate-700">Mật khẩu *</label>
                <input type="password" id="login-password" required value="123456" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-primary-500" />
              </div>

              <button type="submit" class="w-full py-3 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-xl transition-colors shadow-xs cursor-pointer text-sm">
                Đăng Nhập Tài Khoản
              </button>
            </form>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
