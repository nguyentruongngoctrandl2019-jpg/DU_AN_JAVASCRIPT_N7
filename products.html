<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danh Sách Sản Phẩm Công Nghệ Chính Hãng | CT Tech Store</title>
  <meta name="description"
    content="Danh mục đầy đủ điện thoại flagship, MacBook, laptop gaming, máy tính bảng, âm thanh và phụ kiện công nghệ cao cấp tại CT Tech Store." />
  <!-- Google Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-40 bg-slate-950/95 backdrop-blur-md border-b border-slate-800 text-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        <a href="/index.html" class="flex items-center gap-2.5 shrink-0">
          <span
            class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 text-white font-black flex items-center justify-center text-base shadow-md shadow-blue-500/20">CT</span>
          <span class="text-lg font-black tracking-tight text-white whitespace-nowrap">CT TECH STORE</span>
        </a>

        <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-300">
          <a href="/index.html" class="hover:text-white transition-colors whitespace-nowrap">Trang chủ</a>
          <a href="/products.html" class="text-blue-400 font-semibold whitespace-nowrap">Sản phẩm</a>
          <a href="/products.html?category=phone" class="hover:text-white transition-colors whitespace-nowrap">Điện
            thoại</a>
          <a href="/products.html?category=laptop"
            class="hover:text-white transition-colors whitespace-nowrap">Laptop</a>
          <a href="/profile.html" class="hover:text-white transition-colors whitespace-nowrap">Đơn hàng</a>
        </nav>

        <div class="flex items-center gap-3 shrink-0">
          <a href="/cart.html"
            class="relative p-2 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition-colors"
            aria-label="Giỏ hàng">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
            </svg>
            <span
              class="ct-cart-badge absolute -top-1 -right-1 bg-red-600 text-white font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-950 hidden">0</span>
          </a>
          <div class="ct-user-auth-slot flex items-center"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- Breadcrumb -->
  <div class="bg-white border-b border-slate-200 py-3 text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center gap-2">
      <a href="/index.html" class="hover:text-slate-900 transition-colors">Trang chủ</a>
      <span>/</span>
      <span class="text-slate-900 font-semibold">Tất cả sản phẩm</span>
    </div>
  </div>

  <!-- Main Content Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">

    <!-- Top Title and Filter Controls Bar -->
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 pb-6 border-b border-slate-200">
      <div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">Catalog Công Nghệ</h1>
        <p id="product-count-label" class="text-xs text-slate-500 mt-1">Hiển thị các sản phẩm hàng đầu</p>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <!-- Live Search -->
        <div class="relative w-full sm:w-64">
          <input id="catalog-search-input" type="text" placeholder="Tìm theo tên sản phẩm..."
            class="w-full bg-white border border-slate-300 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-500 shadow-sm" />
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5 pointer-events-none" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>

        <!-- Sort Dropdown -->
        <div class="flex items-center gap-2 text-xs">
          <label for="sort-select" class="text-slate-500 font-medium whitespace-nowrap">Sắp xếp:</label>
          <select id="sort-select"
            class="bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 font-medium focus:outline-none focus:border-blue-500 shadow-sm">
            <option value="featured">Nổi bật nhất</option>
            <option value="price-asc">Giá: Thấp đến Cao</option>
            <option value="price-desc">Giá: Cao đến Thấp</option>
            <option value="rating-desc">Đánh giá cao nhất</option>
            <option value="name-asc">Tên: A → Z</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Layout: Filter Sidebar + Products Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 pt-8">

      <!-- Sidebar Filters -->
      <aside class="space-y-6">

        <!-- Category Filter -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
          <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wider">Danh mục thiết bị</h3>
          <div id="category-filter-list" class="space-y-1.5 text-xs">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <!-- Brand Filter -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
          <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wider">Thương hiệu</h3>
          <div id="brand-filter-list" class="space-y-1.5 text-xs">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <!-- Price Range Filter -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
          <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wider">Mức giá</h3>
          <div id="price-filter-list" class="space-y-1.5 text-xs">
            <label class="flex items-center gap-2 cursor-pointer hover:text-blue-600">
              <input type="radio" name="price-range" value="all" checked class="text-blue-600 focus:ring-blue-500" />
              <span>Tất cả mức giá</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer hover:text-blue-600">
              <input type="radio" name="price-range" value="under-5m" class="text-blue-600 focus:ring-blue-500" />
              <span>Dưới 5 triệu</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer hover:text-blue-600">
              <input type="radio" name="price-range" value="5m-15m" class="text-blue-600 focus:ring-blue-500" />
              <span>Từ 5 - 15 triệu</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer hover:text-blue-600">
              <input type="radio" name="price-range" value="15m-30m" class="text-blue-600 focus:ring-blue-500" />
              <span>Từ 15 - 30 triệu</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer hover:text-blue-600">
              <input type="radio" name="price-range" value="above-30m" class="text-blue-600 focus:ring-blue-500" />
              <span>Trên 30 triệu (Flagship)</span>
            </label>
          </div>
        </div>

        <!-- Reset Filter Button -->
        <button id="reset-filters-btn"
          class="w-full py-2.5 px-4 rounded-xl border border-slate-300 hover:bg-slate-100 text-xs font-semibold text-slate-700 transition-colors">
          Xóa tất cả bộ lọc
        </button>

      </aside>

      <!-- Product Grid Area -->
      <section class="lg:col-span-3">
        <div id="catalog-products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Injected by JavaScript -->
        </div>

        <!-- Empty state when no products match -->
        <div id="catalog-empty-state"
          class="hidden py-16 text-center space-y-3 bg-white rounded-2xl border border-slate-200">
          <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-400 mx-auto flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
          <h3 class="text-sm font-bold text-slate-800">Không tìm thấy sản phẩm phù hợp</h3>
          <p class="text-xs text-slate-500">Hãy thử thay đổi từ khóa tìm kiếm hoặc bỏ bớt các tiêu chí lọc.</p>
          <button onclick="window.clearAllFilters()"
            class="mt-2 px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-semibold hover:bg-blue-500 transition-colors">
            Xem tất cả sản phẩm
          </button>
        </div>
      </section>

    </div>
  </main>

  <!-- Footer Container -->
  <div id="footer-container"></div>

  <script src="/script.js"></script>
  <script>
    let currentCategory = 'all';
    let currentBrand = 'all';
    let currentPriceRange = 'all';
    let currentSearch = '';
    let currentSort = 'featured';

    document.addEventListener('DOMContentLoaded', async () => {
      await CTTech.initDatabase();

      // Parse query params (e.g. ?category=phone&search=iphone)
      const params = new URLSearchParams(window.location.search);
      if (params.get('category')) currentCategory = params.get('category');
      if (params.get('brand')) currentBrand = params.get('brand');
      if (params.get('search')) {
        currentSearch = params.get('search');
        const input = document.getElementById('catalog-search-input');
        if (input) input.value = currentSearch;
      }

      renderFilterLists();
      bindEvents();
      applyFilterAndRender();

      // Modular footer
      fetch('/footer.html')
        .then(res => res.text())
        .then(html => { document.getElementById('footer-container').innerHTML = html; })
        .catch(() => { });
    });

    function renderFilterLists() {
      const products = CTTech.getProducts();

      // 1. Categories
      const categories = [
        { id: 'all', name: 'Tất cả sản phẩm' },
        { id: 'phone', name: 'Điện thoại' },
        { id: 'laptop', name: 'Laptop & MacBook' },
        { id: 'tablet', name: 'Máy tính bảng' },
        { id: 'smartwatch', name: 'Đồng hồ thông minh' },
        { id: 'audio', name: 'Âm thanh & Tai nghe' },
        { id: 'accessory', name: 'Phụ kiện cao cấp' }
      ];

      const catContainer = document.getElementById('category-filter-list');
      catContainer.innerHTML = categories.map(c => `
          <button 
            type="button" 
            onclick="setCategory('${c.id}')" 
            class="w-full text-left px-3 py-2 rounded-xl transition-all flex items-center justify-between ${currentCategory === c.id ? 'bg-blue-50 text-blue-700 font-bold' : 'text-slate-600 hover:bg-slate-100'}"
          >
            <span>${c.name}</span>
            <span class="text-[11px] text-slate-400">
              ${c.id === 'all' ? products.length : products.filter(p => p.category === c.id).length}
            </span>
          </button>
        `).join('');

      // 2. Brands
      const brands = Array.from(new Set(products.map(p => p.brand))).filter(Boolean);
      const brandContainer = document.getElementById('brand-filter-list');
      brandContainer.innerHTML = `
          <button 
            type="button" 
            onclick="setBrand('all')" 
            class="w-full text-left px-3 py-1.5 rounded-lg transition-all flex items-center justify-between ${currentBrand === 'all' ? 'text-blue-600 font-bold' : 'text-slate-600 hover:text-slate-900'}"
          >
            <span>Tất cả thương hiệu</span>
          </button>
          ${brands.map(b => `
            <button 
              type="button" 
              onclick="setBrand('${b}')" 
              class="w-full text-left px-3 py-1.5 rounded-lg transition-all flex items-center justify-between ${currentBrand === b ? 'text-blue-600 font-bold' : 'text-slate-600 hover:text-slate-900'}"
            >
              <span>${b}</span>
              <span class="text-[11px] text-slate-400">${products.filter(p => p.brand === b).length}</span>
            </button>
          `).join('')}
        `;
    }

    function bindEvents() {
      // Search
      const searchInput = document.getElementById('catalog-search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          currentSearch = e.target.value.trim().toLowerCase();
          applyFilterAndRender();
        });
      }

      // Sort
      const sortSelect = document.getElementById('sort-select');
      if (sortSelect) {
        sortSelect.addEventListener('change', (e) => {
          currentSort = e.target.value;
          applyFilterAndRender();
        });
      }

      // Price radio
      document.querySelectorAll('input[name="price-range"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
          currentPriceRange = e.target.value;
          applyFilterAndRender();
        });
      });

      // Reset
      document.getElementById('reset-filters-btn').addEventListener('click', clearAllFilters);
    }

    window.setCategory = (cat) => {
      currentCategory = cat;
      renderFilterLists();
      applyFilterAndRender();
    };

    window.setBrand = (brand) => {
      currentBrand = brand;
      renderFilterLists();
      applyFilterAndRender();
    };

    window.clearAllFilters = () => {
      currentCategory = 'all';
      currentBrand = 'all';
      currentPriceRange = 'all';
      currentSearch = '';
      currentSort = 'featured';

      document.getElementById('catalog-search-input').value = '';
      document.getElementById('sort-select').value = 'featured';
      const allRadio = document.querySelector('input[name="price-range"][value="all"]');
      if (allRadio) allRadio.checked = true;

      renderFilterLists();
      applyFilterAndRender();
    };

    function applyFilterAndRender() {
      let items = CTTech.getProducts();

      // 1. Category Filter
      if (currentCategory !== 'all') {
        items = items.filter(p => p.category === currentCategory);
      }

      // 2. Brand Filter
      if (currentBrand !== 'all') {
        items = items.filter(p => p.brand === currentBrand);
      }

      // 3. Price Filter
      if (currentPriceRange === 'under-5m') {
        items = items.filter(p => p.price < 5000000);
      } else if (currentPriceRange === '5m-15m') {
        items = items.filter(p => p.price >= 5000000 && p.price <= 15000000);
      } else if (currentPriceRange === '15m-30m') {
        items = items.filter(p => p.price >= 15000000 && p.price <= 30000000);
      } else if (currentPriceRange === 'above-30m') {
        items = items.filter(p => p.price > 30000000);
      }

      // 4. Search Filter
      if (currentSearch) {
        items = items.filter(p =>
          p.name.toLowerCase().includes(currentSearch) ||
          p.brand.toLowerCase().includes(currentSearch) ||
          (p.description && p.description.toLowerCase().includes(currentSearch))
        );
      }

      // 5. Sorting
      if (currentSort === 'price-asc') {
        items.sort((a, b) => a.price - b.price);
      } else if (currentSort === 'price-desc') {
        items.sort((a, b) => b.price - a.price);
      } else if (currentSort === 'rating-desc') {
        items.sort((a, b) => (b.rating || 0) - (a.rating || 0));
      } else if (currentSort === 'name-asc') {
        items.sort((a, b) => a.name.localeCompare(b.name));
      }

      // Update count label
      document.getElementById('product-count-label').textContent = `Tìm thấy ${items.length} sản phẩm phù hợp`;

      // Render Grid
      const grid = document.getElementById('catalog-products-grid');
      const empty = document.getElementById('catalog-empty-state');

      if (items.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        grid.innerHTML = items.map(p => `
            <div class="bg-white rounded-2xl border border-slate-200/80 p-4 flex flex-col justify-between product-card group">
              <div>
                <div class="relative aspect-4/3 rounded-xl overflow-hidden bg-slate-100 mb-4">
                  <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" />
                  <div class="absolute top-2.5 right-2.5 bg-slate-900/80 backdrop-blur text-white text-[10px] font-semibold px-2 py-0.5 rounded">
                    ${p.brand}
                  </div>
                  ${p.discount ? `
                    <div class="absolute top-2.5 left-2.5 bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">
                      -${p.discount}%
                    </div>
                  ` : ''}
                </div>

                <div class="text-xs text-slate-500 mb-1 flex items-center justify-between">
                  <span>${p.categoryName}</span>
                  <span class="text-amber-500 font-semibold">★ ${p.rating}</span>
                </div>

                <h3 class="text-sm font-bold text-slate-900 line-clamp-2 hover:text-blue-600 transition-colors">
                  <a href="/product-detail.html?id=${p.id}">${p.name}</a>
                </h3>

                <p class="text-xs text-slate-500 line-clamp-2 mt-1.5 leading-relaxed">
                  ${p.description}
                </p>

                <div class="mt-3 flex items-baseline gap-2">
                  <span class="text-base font-extrabold text-blue-600 tabular-nums">${CTTech.formatVND(p.price)}</span>
                  ${p.oldPrice ? `<span class="text-xs text-slate-400 line-through tabular-nums">${CTTech.formatVND(p.oldPrice)}</span>` : ''}
                </div>
              </div>

              <div class="mt-4 pt-3 border-t border-slate-100 flex items-center gap-2">
                <a href="/product-detail.html?id=${p.id}" class="flex-1 text-center py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
                  Chi tiết
                </a>
                <button onclick="CTTech.addToCart('${p.id}')" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold transition-colors flex items-center justify-center gap-1" title="Thêm vào giỏ">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                  Thêm
                </button>
              </div>
            </div>
          `).join('');
      }
    }
  </script>
</body>

</html>
