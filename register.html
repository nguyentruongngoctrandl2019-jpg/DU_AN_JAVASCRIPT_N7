<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Ký Tài Khoản | CT Tech Store</title>
  <meta name="description"
    content="Tạo tài khoản thành viên CT Tech Store để nhận ngay voucher giảm 10% và trải nghiệm mua sắm công nghệ chính hãng." />
  <!-- Google Fonts & Styles -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col justify-between">

  <!-- Top Navigation Bar -->
  <header class="bg-slate-950 text-white border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/index.html" class="flex items-center gap-2.5">
        <span
          class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 text-white font-black flex items-center justify-center text-sm shadow-md">CT</span>
        <span class="text-base font-black tracking-tight">CT TECH STORE</span>
      </a>
      <a href="/login.html" class="text-xs text-blue-400 hover:text-white transition-colors">Đã có tài khoản? Đăng nhập
        →</a>
    </div>
  </header>

  <!-- Main Register Card -->
  <main class="max-w-lg w-full mx-auto px-4 py-12 flex-1 flex flex-col justify-center">
    <div class="bg-white rounded-3xl border border-slate-200/80 p-8 shadow-xl space-y-6">

      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 mx-auto flex items-center justify-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">Đăng Ký Thành Viên</h1>
        <p class="text-xs text-slate-500">Gia nhập cộng đồng CT Tech Store để nhận ưu đãi công nghệ</p>
      </div>

      <form id="register-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Họ và tên của bạn <span
              class="text-red-500">*</span></label>
          <input id="reg-name" type="text" required placeholder="Ví dụ: Nguyễn Minh Đức"
            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-blue-500" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Địa chỉ Email <span
                class="text-red-500">*</span></label>
            <input id="reg-email" type="email" required placeholder="email@vidu.com"
              class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Số điện thoại <span
                class="text-red-500">*</span></label>
            <input id="reg-phone" type="tel" required placeholder="09xxxxxxxx"
              class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-blue-500" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Địa chỉ nhận hàng mặc định</label>
          <input id="reg-address" type="text" placeholder="Số nhà, tên đường, quận/huyện, tỉnh thành..."
            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-blue-500" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Mật khẩu <span
                class="text-red-500">*</span></label>
            <input id="reg-password" type="password" required placeholder="Ít nhất 6 ký tự"
              class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Xác nhận mật khẩu <span
                class="text-red-500">*</span></label>
            <input id="reg-confirm-password" type="password" required placeholder="Nhập lại mật khẩu"
              class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-blue-500" />
          </div>
        </div>

        <div class="flex items-start gap-2 pt-1">
          <input type="checkbox" required id="reg-terms" class="mt-1 rounded text-blue-600 focus:ring-blue-500" />
          <label for="reg-terms" class="text-xs text-slate-600 leading-snug">
            Tôi đồng ý với <a href="#" class="text-blue-600 hover:underline">Điều khoản bảo mật</a> và nhận hóa đơn điện
            tử chính thức từ CT Tech Store.
          </label>
        </div>

        <button type="submit"
          class="w-full py-3.5 px-6 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2">
          Đăng ký tài khoản ngay
        </button>
      </form>

      <div class="text-center pt-2 text-xs text-slate-500">
        Đã có tài khoản thành viên?
        <a href="/login.html" class="text-blue-600 hover:text-blue-700 font-bold ml-1">Đăng nhập tại đây</a>
      </div>

    </div>
  </main>

  <!-- Footer Container -->
  <div id="footer-container"></div>

  <script src="/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await CTTech.initDatabase();

      const form = document.getElementById('register-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        const address = document.getElementById('reg-address').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirmPassword = document.getElementById('reg-confirm-password').value;

        if (password !== confirmPassword) {
          CTTech.showToast('Mật khẩu xác nhận không khớp!', 'error');
          return;
        }

        if (password.length < 3) {
          CTTech.showToast('Mật khẩu tối thiểu 3 ký tự!', 'error');
          return;
        }

        const res = CTTech.register({ name, email, phone, address, password });
        if (res.success) {
          setTimeout(() => {
            window.location.href = '/profile.html';
          }, 600);
        } else {
          CTTech.showToast(res.message, 'error');
        }
      });

      fetch('/footer.html')
        .then(res => res.text())
        .then(html => { document.getElementById('footer-container').innerHTML = html; })
        .catch(() => { });
    });
  </script>
</body>

</html>
